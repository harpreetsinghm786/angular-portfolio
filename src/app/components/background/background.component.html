<section class="background container" id="background">

  <div class="eyebrow">Background</div>
  <h2 class="section-title" data-aos="fade-up">Education &amp; Achievements</h2>

  <div class="bg-grid">

    <!-- ── EDUCATION ── -->
    <div data-aos="fade-up">
      <div class="panel-eyebrow">Academic Record</div>

      <div class="edu-list">
        <div
          class="edu-item"
          *ngFor="let ed of eduData; let i = index"
          [style.animation-delay]="(i * 100) + 'ms'"
        >
          <span class="edu-index">0{{ i + 1 }}</span>
          <div class="edu-body">
            <span class="edu-degree">{{ ed.degree }}</span>
            <span class="edu-inst">{{ ed.institution }}</span>
            <div class="edu-meta">
              <span class="edu-duration">{{ ed.duration }}</span>
              <span class="edu-status">✓ Completed</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ── ACHIEVEMENTS ── -->
    <div data-aos="fade-up" data-aos-delay="120">
      <div class="panel-eyebrow">Unlocked</div>

      <div class="ach-grid">
        <div
          class="ach-card"
          *ngFor="let ach of achData; let i = index"
          [style.animation-delay]="(i * 80) + 'ms'"
        >
          <span class="ach-num">{{ (i + 1) | number: '2.0-0' }}</span>
          <span class="ach-text">{{ ach.title }}</span>
          <span class="ach-sub" *ngIf="ach.sub">{{ ach.sub }}</span>
          <span class="ach-icon">
            <i [class]="ach.icon || 'fa-solid fa-star'"></i>
          </span>
        </div>
      </div>
    </div>

  </div>

</section>
