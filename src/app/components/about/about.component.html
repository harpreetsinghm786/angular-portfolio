<section class="about container" id="about" data-aos="fade-up">

    <div class="eyebrow">About Me</div>

    <div class="main-row">
        <h2 class="headline">
            Building<br>
            <span class="grad">fast &amp;</span><br>
            beautiful.
        </h2>
        <div class="stats-row">
            <div class="stat-orb" *ngFor="let s of stats; let i = index"
                [style.animation-delay]="(0.2 + i * 0.12) + 's'">
                <span class="stat-num">{{ s.display }}</span>
                <span class="stat-lbl">{{ s.label }}</span>
            </div>
        </div>
    </div>

    <div class="rule"></div>

    <p class="intro">
        <span>{{ typedText }}</span><span class="cursor">|</span>
    </p>

    <div class="chips">
        <div class="chip" *ngFor="let h of about.highlights; let i = index"
            [style.animation-delay]="(0.45 + i * 0.08) + 's'">
            <span class="chip-dot"></span>{{ h.text }}
        </div>
    </div>

</section>
